<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Data Hub | REST API Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --font: 'Inter', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12), transparent 40%),
                        radial-gradient(circle at 90% 20%, rgba(236, 72, 153, 0.10), transparent 40%);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      padding: 2rem 1rem 4rem;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--card-border); }
    .logo { font-size: 1.25rem; font-weight: 700; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge-online { display: flex; align-items: center; gap: 0.5rem; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 0.25rem 0.75rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
    .pulse { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.8); } 70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } }
    .hero { text-align: center; margin: 2.5rem 0 2rem; }
    .hero h1 { font-size: 2.5rem; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--muted); max-width: 600px; margin: 0.5rem auto 1rem; font-size: 0.95rem; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card); border: 1px solid var(--card-border); padding: 1rem; border-radius: 12px; backdrop-filter: blur(10px); }
    .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .stat-lbl { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .api-list { display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.25rem; backdrop-filter: blur(8px); transition: border-color 0.2s; }
    .card:hover { border-color: rgba(99, 102, 241, 0.4); }
    .card-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    .endpoint { display: flex; align-items: center; gap: 0.75rem; font-family: var(--mono); font-size: 0.95rem; font-weight: 600; }
    .m-badge { font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 6px; }
    .m-get { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .m-post { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .m-put { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .m-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }
    .btn { background: var(--gradient); border: none; color: white; padding: 0.45rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .input-box { margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .input-box label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; }
    .input-box input, .input-box textarea { background: #070a10; border: 1px solid var(--card-border); color: #fff; font-family: var(--mono); font-size: 0.8rem; padding: 0.5rem; border-radius: 6px; width: 100%; outline: none; }
    .input-box input:focus, .input-box textarea:focus { border-color: var(--primary); }
    .resp-box { margin-top: 0.75rem; background: #05070d; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; display: none; }
    .resp-bar { display: flex; justify-content: space-between; align-items: center; padding: 0.35rem 0.75rem; background: rgba(255, 255, 255, 0.02); font-size: 0.7rem; font-family: var(--mono); }
    .resp-code { font-weight: 700; color: #34d399; }
    .resp-pre { padding: 0.75rem; font-family: var(--mono); font-size: 0.75rem; color: #e5e7eb; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .btn-copy { background: transparent; border: 1px solid var(--card-border); color: var(--muted); font-size: 0.65rem; padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; }
    .btn-copy:hover { color: #fff; }
    .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #1e293b; color: #34d399; border: 1px solid #34d399; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.8rem; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">&bull; The Data Hub</div>
      <div class="badge-online"><span class="pulse"></span>Server Online &bull; Port 5000</div>
    </div>

    <div class="hero">
      <h1>The Data Hub API</h1>
      <p>Clean, in-memory RESTful microservice with Spring Boot 3 &amp; Java 17+. Zero database latency with thread-safe atomic synchronization.</p>
    </div>

    <div class="stats">
      <div class="stat-card"><div class="stat-val" id="stat-posts">0</div><div class="stat-lbl">Total Posts</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-uptime">00h 00m 00s</div><div class="stat-lbl">Uptime</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-requests">0</div><div class="stat-lbl">Requests Handled</div></div>
    </div>

    <div class="api-list" id="api-list"></div>
    <div class="toast" id="toast">&#10003; Copied to clipboard!</div>
  </div>

  <script>
    // Declarative Endpoint Configurations
    const ENDPOINTS = [
      { id: 'health', method: 'GET', path: '/health', desc: 'System health check and live operational telemetry.' },
      { id: 'get-posts', method: 'GET', path: '/posts', desc: 'Retrieve all blog posts from in-memory storage.' },
      { id: 'create-post', method: 'POST', path: '/posts', desc: 'Create a post with validated title, content, author.',
        body: JSON.stringify({ title: "In-Memory Architecture", content: "Clean Spring Boot 3 design pattern.", author: "Engineer" }, null, 2) },
      { id: 'get-post', method: 'GET', path: '/posts/{id}', desc: 'Fetch single post by ID (returns 404 if missing).', param: '1' },
      { id: 'update-post', method: 'PUT', path: '/posts/{id}', desc: 'Update existing post fields by ID.', param: '1',
        body: JSON.stringify({ title: "Updated Architecture", content: "Revised benchmarks and notes.", author: "Architect" }, null, 2) },
      { id: 'delete-post', method: 'DELETE', path: '/posts/{id}', desc: 'Remove post using removeIf stream filter.', param: '1' },
      { id: 'login', method: 'POST', path: '/login', desc: 'Mock JWT auth returning a 3-part Base64URL token.',
        body: JSON.stringify({ email: "developer@datahub.io", password: "Password123!" }, null, 2) }
    ];

    // Render Clean Minimal Cards
    const listEl = document.getElementById('api-list');
    listEl.innerHTML = ENDPOINTS.map(ep => `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="endpoint">
              <span class="m-badge m-${ep.method.toLowerCase()}">${ep.method}</span>
              <span>${ep.path}</span>
            </div>
            <div class="desc">${ep.desc}</div>
          </div>
          <button class="btn" onclick="sendReq('${ep.id}')">&#9654; Try it</button>
        </div>
        ${ep.param !== undefined ? `
          <div class="input-box" style="max-width:180px;">
            <label>ID Parameter</label>
            <input type="number" id="param-${ep.id}" value="${ep.param}" min="1" />
          </div>` : ''}
        ${ep.body ? `
          <div class="input-box">
            <label>Payload (JSON)</label>
            <textarea id="body-${ep.id}" rows="3">${ep.body}</textarea>
          </div>` : ''}
        <div class="resp-box" id="box-${ep.id}">
          <div class="resp-bar">
            <span class="resp-code" id="status-${ep.id}">200 OK</span>
            <span id="time-${ep.id}">0ms</span>
            <button class="btn-copy" onclick="copyResp('pre-${ep.id}')">Copy</button>
          </div>
          <pre class="resp-pre" id="pre-${ep.id}"></pre>
        </div>
      </div>
    `).join('');

    // Request Dispatcher
    async function sendReq(id) {
      const ep = ENDPOINTS.find(e => e.id === id);
      let url = ep.path;
      if (ep.param !== undefined) {
        const pVal = document.getElementById(`param-${id}`).value || '1';
        url = url.replace('{id}', encodeURIComponent(pVal));
      }
      const opts = { method: ep.method, headers: { 'Content-Type': 'application/json' } };
      if (ep.body) {
        opts.body = document.getElementById(`body-${id}`).value;
      }
      const box = document.getElementById(`box-${id}`);
      const code = document.getElementById(`status-${id}`);
      const time = document.getElementById(`time-${id}`);
      const pre = document.getElementById(`pre-${id}`);
      box.style.display = 'block';
      pre.textContent = 'Sending...';

      const t0 = performance.now();
      try {
        const res = await fetch(url, opts);
        const dt = Math.round(performance.now() - t0);
        const json = await res.json();
        code.textContent = `${res.status} ${res.statusText || (res.ok ? 'OK' : 'ERR')}`;
        code.style.color = res.ok ? '#34d399' : '#f87171';
        time.textContent = `${dt}ms`;
        pre.textContent = JSON.stringify(json, null, 2);
        loadStats();
      } catch (err) {
        code.textContent = 'ERR';
        code.style.color = '#f87171';
        time.textContent = `${Math.round(performance.now() - t0)}ms`;
        pre.textContent = JSON.stringify({ success: false, message: err.message }, null, 2);
      }
    }

    // Live Stats Poller
    async function loadStats() {
      try {
        const res = await fetch('/health');
        if (res.ok) {
          const { data } = await res.json();
          document.getElementById('stat-uptime').textContent = data.uptime;
          document.getElementById('stat-posts').textContent = data.totalPosts;
          document.getElementById('stat-requests').textContent = data.requestsServed;
        }
      } catch {}
    }
    loadStats();
    setInterval(loadStats, 3000);

    // Copy to Clipboard
    function copyResp(preId) {
      navigator.clipboard.writeText(document.getElementById(preId).textContent).then(() => {
        const t = document.getElementById('toast');
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 1800);
      });
    }
  </script>
</body>
</html>
