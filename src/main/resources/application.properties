# ===================================================================
# The Data Hub - Server Configuration
# ===================================================================

# Port configuration: Defaults to 5000 or reads from $PORT environment variable
server.port=${PORT:5000}

# Application Name
spring.application.name=data-hub

# Seed data flag: false by default (in-memory list remains empty)
# Set APP_SEED=true or app.seed=true to load 3 sample posts on startup
app.seed=${APP_SEED:false}

# Disable browser caching for static resources so updates reflect immediately
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Enable graceful handling and response formatting
spring.mvc.problemdetails.enabled=false
